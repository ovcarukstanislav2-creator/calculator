<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .btn-press:active { transform: scale(0.92); }
    </style>
</head>
<body class="bg-neutral-950 flex items-center justify-center h-screen select-none m-0 font-sans">

    <!-- Корпус смартфона -->
    <div class="w-full max-w-[360px] h-full max-h-[740px] bg-black rounded-none sm:rounded-[40px] shadow-2xl flex flex-col justify-between p-6 border-0 sm:border-4 border-neutral-800">
        
        <!-- Верхняя строка (динамик/камера кастом) -->
        <div class="flex justify-between items-center text-neutral-400 text-xs px-2 pt-2">
            <span>9:41</span>
            <div class="w-16 h-4 bg-neutral-900 rounded-full"></div>
            <span>100%</span>
        </div>

        <!-- Экран калькулятора -->
        <div class="flex flex-col justify-end items-end p-4 my-auto w-full overflow-hidden">
            <div id="previous-operand" class="text-neutral-500 text-lg h-8 truncate w-full text-right"></div>
            <div id="current-operand" class="text-white text-6xl font-light tracking-wide truncate w-full text-right">0</div>
        </div>

        <!-- Кнопки клавиатуры -->
        <div class="grid grid-cols-4 gap-3 pb-4">
            <button onclick="clearAll()" class="btn-press h-16 rounded-full bg-neutral-800 text-neutral-300 font-medium text-xl flex items-center justify-center">AC</button>
            <button onclick="deleteDigit()" class="btn-press h-16 rounded-full bg-neutral-800 text-neutral-300 font-medium text-xl flex items-center justify-center">⌫</button>
            <button onclick="appendOperator('%')" class="btn-press h-16 rounded-full bg-neutral-800 text-neutral-300 font-medium text-xl flex items-center justify-center">%</button>
            <button onclick="appendOperator('/')" class="btn-press h-16 rounded-full bg-amber-500 text-white font-medium text-2xl flex items-center justify-center">÷</button>

            <button onclick="appendNumber('7')" class="btn-press h-16 rounded-full bg-neutral-900 text-white font-medium text-2xl flex items-center justify-center">7</button>
            <button onclick="appendNumber('8')" class="btn-press h-16 rounded-full bg-neutral-900 text-white font-medium text-2xl flex items-center justify-center">8</button>
            <button onclick="appendNumber('9')" class="btn-press h-16 rounded-full bg-neutral-900 text-white font-medium text-2xl flex items-center justify-center">9</button>
            <button onclick="appendOperator('*')" class="btn-press h-16 rounded-full bg-amber-500 text-white font-medium text-2xl flex items-center justify-center">×</button>

            <button onclick="appendNumber('4')" class="btn-press h-16 rounded-full bg-neutral-900 text-white font-medium text-2xl flex items-center justify-center">4</button>
            <button onclick="appendNumber('5')" class="btn-press h-16 rounded-full bg-neutral-900 text-white font-medium text-2xl flex items-center justify-center">5</button>
            <button onclick="appendNumber('6')" class="btn-press h-16 rounded-full bg-neutral-900 text-white font-medium text-2xl flex items-center justify-center">6</button>
            <button onclick="appendOperator('-')" class="btn-press h-16 rounded-full bg-amber-500 text-white font-medium text-2xl flex items-center justify-center">-</button>

            <button onclick="appendNumber('1')" class="btn-press h-16 rounded-full bg-neutral-900 text-white font-medium text-2xl flex items-center justify-center">1</button>
            <button onclick="appendNumber('2')" class="btn-press h-16 rounded-full bg-neutral-900 text-white font-medium text-2xl flex items-center justify-center">2</button>
            <button onclick="appendNumber('3')" class="btn-press h-16 rounded-full bg-neutral-900 text-white font-medium text-2xl flex items-center justify-center">3</button>
            <button onclick="appendOperator('+')" class="btn-press h-16 rounded-full bg-amber-500 text-white font-medium text-2xl flex items-center justify-center">+</button>

            <button onclick="appendNumber('0')" class="btn-press h-16 col-span-2 rounded-full bg-neutral-900 text-white font-medium text-2xl flex items-center justify-start pl-7">0</button>
            <button onclick="appendDot()" class="btn-press h-16 rounded-full bg-neutral-900 text-white font-medium text-2xl flex items-center justify-center">.</button>
            <button onclick="calculate()" class="btn-press h-16 rounded-full bg-amber-500 text-white font-medium text-2xl flex items-center justify-center">=</button>
        </div>

    </div>

    <script>
        let currentOperandElement = document.getElementById('current-operand');
        let previousOperandElement = document.getElementById('previous-operand');
        let currentInput = '0';
        let previousInput = '';
        let operation = null;

        function updateDisplay() {
            currentOperandElement.innerText = currentInput;
            previousOperandElement.innerText = operation ? `${previousInput} ${operation}` : '';
        }

        function appendNumber(number) {
            if (currentInput === '0') {
                currentInput = number;
            } else {
                currentInput += number;
            }
            updateDisplay();
        }

        function appendDot() {
            if (!currentInput.includes('.')) {
                currentInput += '.';
                updateDisplay();
            }
        }

        function appendOperator(op) {
            if (operation !== null) calculate();
            previousInput = currentInput;
            operation = op;
            currentInput = '0';
            updateDisplay();
        }

        function calculate() {
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            if (isNaN(prev) || isNaN(current)) return;
            switch (operation) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': result = prev === 0 ? 'Ошибка' : prev / current; break;
                case '%': result = prev * (current / 100); break;
                default: return;
            }
            currentInput = result.toString();
            operation = null;
            previousInput = '';
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            previousInput = '';
            operation = null;
            updateDisplay();
        }

        function deleteDigit() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }
    </script>
</body>
</html>
